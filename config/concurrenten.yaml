# Top-20 concurrenten van Houthandel Gorinchem.
#
# LET OP: winkels van de eigen groep (HoutUnie) zijn GEEN concurrent en staan hier bewust niet in:
# houthandelgorinchem.nl, brabantsehouthandel.nl, houthandelbelgie.be, tuinhoutvoordeel.nl,
# 123douglashout.nl, overkappingen.nl, tuinhoutonline.nl (≠ onlinetuinhout.nl!), houtenplanken.nl,
# houthandelbreda.nl, houthandelarnhem.nl, rotterdamsehouthandel.nl
#
# VOORSTEL – valideer deze lijst met de verkoop: wie verliezen we offertes/klanten aan?
#
# Velden:
#   id            korte sleutel (gebruikt in config/matches.csv)
#   naam          weergavenaam in rapporten
#   type          bouwmarkt | houthandel | online
#   gewicht       relevantie 0.1 - 2.0. Directe, regionale concurrenten wegen zwaarder
#                 mee in de marktprijs dan landelijke bouwmarkten.
#   prijs_incl_btw  true als de site prijzen incl. 21% btw toont (consumentensites)
#   min_interval_sec  minimale wachttijd tussen requests naar dit domein (beleefd scrapen)
#   selectors     optioneel: CSS-selectors als JSON-LD/microdata ontbreekt
#                 (prijs, actieprijs, voorraad). Laat leeg voor automatische detectie.

instellingen:
  user_agent: "HoutGorinchemPrijsmonitor/1.0 (+prijsmonitor; contact via website)"
  timeout_sec: 20
  max_pogingen: 3
  respecteer_robots_txt: true
  standaard_min_interval_sec: 4

concurrenten:
  - id: gamma
    naam: GAMMA
    type: bouwmarkt
    gewicht: 1.0
    prijs_incl_btw: true
    basis_url: https://www.gamma.nl
    bereikbaar: false
    notitie: "Botbescherming (HTTP 429)"

  - id: karwei
    naam: KARWEI
    type: bouwmarkt
    gewicht: 0.9
    prijs_incl_btw: true
    basis_url: https://www.karwei.nl
    bereikbaar: false
    notitie: "Botbescherming (HTTP 429)"

  - id: praxis
    naam: Praxis
    type: bouwmarkt
    gewicht: 1.0
    prijs_incl_btw: true
    basis_url: https://www.praxis.nl
    bereikbaar: false
    notitie: "Weigert geïdentificeerde bots (HTTP 403)"

  - id: hornbach
    naam: HORNBACH
    type: bouwmarkt
    gewicht: 1.2
    prijs_incl_btw: true
    basis_url: https://www.hornbach.nl
    bereikbaar: false
    notitie: "JavaScript-botcheck"

  - id: bouwmaat
    naam: Bouwmaat
    type: houthandel
    gewicht: 1.4
    prijs_incl_btw: false
    basis_url: https://www.bouwmaat.nl
    catalogus: {soort: shopify}

  - id: houthandelonline
    naam: HouthandelOnline
    type: online
    gewicht: 1.5
    prijs_incl_btw: true
    basis_url: https://www.houthandelonline.nl
    bereikbaar: false
    notitie: "Botbescherming (HTTP 403)"

  - id: gadero
    naam: Gadero
    type: online
    gewicht: 1.2
    prijs_incl_btw: true
    basis_url: https://gadero.nl
    notitie: "Alleen productpagina's met lengte in de URL"

  - id: onlinetuinhout
    naam: Online Tuinhout
    type: online
    gewicht: 1.1
    prijs_incl_btw: true
    basis_url: https://www.onlinetuinhout.nl
    selectors:
      prijs: "#base_price"
    catalogus: {soort: sitemap, sitemaps: ["https://www.onlinetuinhout.nl/sitemap.xml"], max_paginas: 1200}

  - id: opmaatzagen
    naam: OPMAATZAGEN.nl
    type: online
    gewicht: 1.0
    prijs_incl_btw: true
    basis_url: https://www.opmaatzagen.nl
    bereikbaar: false
    notitie: "Alleen vanaf-prijzen voor zaagwerk op maat"

  - id: bouwbestel
    naam: Bouwbestel
    type: online
    gewicht: 0.8
    prijs_incl_btw: true
    basis_url: https://www.bouwbestel.nl
    bereikbaar: false
    notitie: "Weigert geïdentificeerde bots (HTTP 403)"
    # Voorbeeld van handmatige selectors (alleen nodig als automatische detectie faalt):
    # selectors:
    #   prijs: ".product-info .price-final"
    #   actieprijs: ".product-info .price-special"
    #   voorraad: ".stock-status"

